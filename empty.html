<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Miner History — Empty state</title>
<link rel="stylesheet" href="kit/styles.css">
<link rel="stylesheet" href="history.css">
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
</head>
<body>
<script src="wireframe-nav.js"></script>
<div id="root"></div>

<script src="data.js"></script>
<script type="text/babel" src="kit/Icons.jsx"></script>
<script type="text/babel" src="kit/Primitives.jsx"></script>
<script type="text/babel" src="kit/SideMenu.jsx"></script>
<script type="text/babel" src="kit/tweaks-panel.jsx"></script>
<script type="text/babel" src="history.jsx"></script>

<script type="text/babel">
const { useState, useEffect } = React;

const TWEAK_DEFAULTS = {
  "surface": "page",
  "openFailedReboot": true,
  "emptyState": true
};

function App(){
  const [tweaks, setTweak] = window.useTweaks(TWEAK_DEFAULTS);
  // (no-op marker)
  const [drawerOpen, setDrawerOpen] = useState(tweaks.surface === "drawer");
  const [view, setView] = useState(tweaks.surface);

  useEffect(() => {
    if (tweaks.surface === "drawer") {
      setView("list");
      setDrawerOpen(true);
    } else {
      setView("page");
      setDrawerOpen(false);
    }
  }, [tweaks.surface]);

  return (
    <div className="lyra-app" data-screen-label={view === "page" ? "01 Miner History · Full Page" : "02 Miner List · Drawer"}>
      <LyraSideMenu active="Miner List" onNavigate={() => {}} />
      <main className="lyra-content" style={{padding: 0, background: "var(--bg-2nd)"}}>
        {view === "page"
          ? (tweaks.emptyState ? <MinerHistoryEmpty /> : <MinerHistoryPage />)
          : <MinerListBackground onView={() => setDrawerOpen(true)} />
        }
      </main>

      {drawerOpen && view === "list" && (
        <MinerHistoryDrawer
          onClose={() => { setDrawerOpen(false); setTweak("surface", "page"); setView("page"); }}
          onOpenFull={() => { setDrawerOpen(false); setTweak("surface", "page"); setView("page"); }}
        />
      )}

      <window.TweaksPanel title="Tweaks">
        <window.TweakSection title="Surface">
          <window.TweakRadio
            label="View"
            value={tweaks.surface}
            onChange={(v) => setTweak("surface", v)}
            options={[
              { value: "page", label: "Full page" },
              { value: "drawer", label: "Drawer" },
            ]}
          />
          {tweaks.surface === "page" && (
            <window.TweakToggle
              label="No miner selected (menu entry)"
              value={tweaks.emptyState}
              onChange={(v) => setTweak("emptyState", v)}
            />
          )}
        </window.TweakSection>
      </window.TweaksPanel>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<App />);
</script>
</body>
</html>
