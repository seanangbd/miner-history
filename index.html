<html lang="en">
<head>

<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
</head>
<body>
<template id="__bundler_thumbnail" data-bg-color="#f4f5f7">
  <svg viewBox="0 0 1200 800" xmlns="http://www.w3.org/2000/svg">
    <rect width="1200" height="800" fill="#f4f5f7"/>
    <rect x="80" y="120" width="1040" height="80" rx="12" fill="#ffffff" stroke="#e5e7eb"/>
    <circle cx="130" cy="160" r="20" fill="#d1fae5"/>
    <rect x="170" y="142" width="240" height="14" rx="4" fill="#111827"/>
    <rect x="170" y="166" width="380" height="10" rx="3" fill="#9ca3af"/>
    <rect x="80" y="230" width="1040" height="500" rx="12" fill="#ffffff" stroke="#e5e7eb"/>
    <rect x="110" y="260" width="120" height="14" rx="3" fill="#10b981"/>
    <rect x="260" y="260" width="120" height="14" rx="3" fill="#9ca3af"/>
    <line x1="110" y1="300" x2="1090" y2="300" stroke="#e5e7eb"/>
    <g fill="#9ca3af">
      <rect x="110" y="330" width="100" height="10" rx="3"/>
      <rect x="260" y="330" width="180" height="10" rx="3"/>
      <rect x="490" y="330" width="80" height="10" rx="3"/>
      <rect x="620" y="330" width="120" height="10" rx="3"/>
    </g>
    <line x1="110" y1="370" x2="1090" y2="370" stroke="#f3f4f6"/>
    <g fill="#9ca3af">
      <rect x="110" y="400" width="100" height="10" rx="3"/>
      <rect x="260" y="400" width="220" height="10" rx="3"/>
      <rect x="490" y="400" width="80" height="10" rx="3" fill="#ef4444"/>
      <rect x="620" y="400" width="140" height="10" rx="3"/>
    </g>
    <line x1="110" y1="440" x2="1090" y2="440" stroke="#f3f4f6"/>
    <g fill="#9ca3af">
      <rect x="110" y="470" width="100" height="10" rx="3"/>
      <rect x="260" y="470" width="200" height="10" rx="3"/>
      <rect x="490" y="470" width="80" height="10" rx="3"/>
      <rect x="620" y="470" width="120" height="10" rx="3"/>
    </g>
  </svg>
</template>
<div id="root"></div>

<script src="data.js"></script>
<script type="text/babel" src="kit/Icons.jsx"></script>
<script type="text/babel" src="kit/Primitives.jsx"></script>
<script type="text/babel" src="kit/SideMenu.jsx"></script>
<script type="text/babel" src="kit/tweaks-panel.jsx"></script>
<script type="text/babel" src="history.jsx"></script>

<script type="text/babel">
const { useState, useEffect } = React;

const TWEAK_DEFAULTS = {
  "openFailedReboot": true,
  "emptyState": false
};

function App(){
  const [tweaks, setTweak] = window.useTweaks(TWEAK_DEFAULTS);
  // Two-step flow: "list" (Miner List + drawer) → "page" (full per-miner page)
  const [stage, setStage] = useState("list");
  const [drawerOpen, setDrawerOpen] = useState(true);

  const goToPage = () => { setDrawerOpen(false); setStage("page"); };
  const goToList = () => { setStage("list"); setDrawerOpen(true); };

  return (
    <div className="lyra-app" data-screen-label={stage === "page" ? "02 View Miner · Full Page" : "01 Miner List · Drawer"}>
      <LyraSideMenu active="Miner List" onNavigate={() => {}} />
      <main className="lyra-content" style={{padding: 0, background: "var(--bg-2nd)"}}>
        {stage === "page"
          ? (tweaks.emptyState ? <MinerHistoryEmpty /> : <MinerHistoryPage onBack={goToList} />)
          : <MinerListBackground onView={() => setDrawerOpen(true)} />
        }
      </main>

      {drawerOpen && stage === "list" && (
        <MinerHistoryDrawer
          onClose={() => setDrawerOpen(false)}
          onOpenFull={goToPage}
        />
      )}

      <window.TweaksPanel title="Tweaks">
        <window.TweakSection title="Flow">
          <window.TweakRadio
            label="Stage"
            value={stage}
            onChange={(v) => { v === "page" ? goToPage() : goToList(); }}
            options={[
              { value: "list", label: "Miner List" },
              { value: "page", label: "Per-miner page" },
            ]}
          />
        </window.TweakSection>
      </window.TweaksPanel>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<App />);
</script>
</body>
</html>
